name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full offline gate from AGENTS.md "Running the tests". Linux has symlinks,
  # so the OpenCode loading tests run here and not on Windows.
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          python -m pip install --quiet pytest
          # The runner image ships jq, shellcheck and mikefarah yq v4.
          jq --version
          shellcheck --version | head -2
          yq --version
      - run: bash tests/hooks/test-session-start.sh
      - run: bash tests/hooks/test-team-memory-hooks.sh
      - run: bash tests/hooks/test-executable-bits.sh
      - run: bash tests/init/run-tests.sh
      - run: node --test tests/team-memory/memory-lint.test.mjs
      - run: bash tests/team-memory/test-templates.sh
      - run: bash tests/team-memory/test-skill-structure.sh
      - run: bash tests/team-memory/test-precommit-lint.sh
      - run: bash tests/task-lifecycle/test-task-lifecycle.sh
      - run: node --test tests/task-lifecycle/ticket-sources.test.mjs
      - run: node --test tests/task-lifecycle/fetch-ticket.test.mjs
      - run: bash tests/autopilot/run-tests.sh
      - run: bash tests/autopilot/test-adapters.sh
      - run: bash tests/qa-gatekeeper/run-tests.sh
      - run: bash tests/skills/test-skill-bodies.sh
      - run: node --test tests/pi/test-pi-extension.mjs
      - run: bash tests/opencode/run-tests.sh
      - run: python -m pytest tests/hermes
      - run: bash tests/kimi/run-tests.sh
      - run: bash tests/devin/test-devin-plugin.sh
      - run: bash tests/codex/test-marketplace-manifest.sh
      - run: bash tests/version-bump/test-bump-version.sh
      - run: bash tests/shell-lint/test-lint-shell.sh
      - run: bash tests/rename-fork/test-rename-fork.sh
      - run: bash tests/antigravity/run-tests.sh
      - run: bash tests/diagnosing-ultrapowers/test-skill-structure.sh
      - run: bash tests/claude-code/test-sdd-workspace.sh
      - run: bash tests/claude-code/test-executing-plans-scripts.sh
      - run: bash tests/claude-code/test-worktree-path-policy.sh
      - name: brainstorm-server
        working-directory: tests/brainstorm-server
        run: npm ci && npm test
      - run: scripts/lint-shell.sh --all
      - name: Version audit
        # The log goes outside the checkout, or the audit finds the version in it.
        run: scripts/bump-version.sh --audit | tee "$RUNNER_TEMP/audit.log" && grep -q "All clear" "$RUNNER_TEMP/audit.log"

  # The hooks must work from Git Bash and from cmd.exe through run-hook.cmd.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bash tests/hooks/test-session-start.sh
      - run: bash tests/hooks/test-team-memory-hooks.sh
      - run: bash tests/hooks/test-run-hook-cmd-windows.sh
      - run: bash tests/init/run-tests.sh
      # fetch-ticket spawns gh and glab without a shell; Windows resolves them differently.
      - run: node --test tests/task-lifecycle/fetch-ticket.test.mjs
      - run: bash tests/autopilot/run-tests.sh
