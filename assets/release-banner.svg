<svg xmlns="http://www.w3.org/2000/svg" width="300" height="56" viewBox="0 0 300 56" role="img" aria-label="Ultrapowers release v1.0.0">
  <title>Ultrapowers release v1.0.0</title>
  <defs>
    <linearGradient id="value" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6304ea"/>
      <stop offset="0.55" stop-color="#8e09fa"/>
      <stop offset="1" stop-color="#c514fc"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e09fa"/>
      <stop offset="1" stop-color="#e758fa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="pill">
      <rect x="10" y="10" width="280" height="36" rx="8"/>
    </clipPath>
  </defs>
  <rect x="10" y="10" width="280" height="36" rx="8" fill="#150448" stroke="url(#edge)" stroke-width="2" filter="url(#glow)"/>
  <g clip-path="url(#pill)">
    <rect x="10" y="10" width="138" height="36" fill="#2d0789"/>
    <rect x="148" y="10" width="142" height="36" fill="url(#value)"/>
  </g>
  <rect x="10" y="10" width="280" height="36" rx="8" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <g font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" text-anchor="middle">
    <text x="79" y="33" font-size="15" letter-spacing="2" fill="#e1bbf6">RELEASE</text>
    <text x="219" y="34" font-size="18" letter-spacing="1" fill="#fefeff">v1.0.0</text>
  </g>
</svg>
